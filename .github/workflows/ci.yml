name: Enterprise Hybrid RAG CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install PyTorch (CPU-only)
        run: |
          pip install --default-timeout=120 --retries 10 \
          --index-url https://download.pytorch.org/whl/cpu torch==2.7.1

      - name: Install Dependencies
        run: |
          pip install --default-timeout=120 --retries 10 -r requirements.txt

      - name: Check Streamlit App Compiles
        run: |
          python -m py_compile streamlit_app/app.py

      - name: Run Unit Tests
        run: |
          pip install pytest
          pytest tests -v

      - name: Check FastAPI Import
        run: |
          python -c "from src.api.main import app"

      - name: Build Docker Image
        run: |
          docker build -t enterprise-rag .
