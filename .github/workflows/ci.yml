name: Enterprise Hybrid RAG CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install PyTorch (CPU-only)
        run: |
          python -m pip install --upgrade pip
          pip install --default-timeout=120 --retries 10 \
            --index-url https://download.pytorch.org/whl/cpu torch==2.7.1

      - name: Install Dependencies
        run: |
          pip install --default-timeout=120 --retries 10 -r requirements.txt

      - name: Check Streamlit App Compiles
        run: |
          python -m py_compile streamlit_app/app.py

      - name: Run Unit Tests
        run: |
          pip install pytest
          pytest src/retrieval/test_bm25.py src/retrieval/test_hybrid.py src/retrieval/test_reranker.py src/retrieval/test_rrf.py -v

      - name: Check FastAPI Import (syntax only)
        run: |
          python -c "import ast; ast.parse(open('src/api/main.py').read())"

      - name: Build Docker Image
        run: |
          docker build -t enterprise-rag .
